<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InvestTrace</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='8' cy='24' r='5' fill='%23d9534f'/><circle cx='24' cy='8' r='5' fill='%232f6fdd'/><circle cx='24' cy='24' r='4' fill='%23e8a33d'/><path d='M8 24L24 8M24 8v16M8 24h16' stroke='%23556' stroke-width='2'/></svg>">
  <link rel="stylesheet" href="/style.css">
  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/panel"><span class="logo"></span>InvestTrace <small>MVP</small></a>
    <form id="searchForm" class="search" role="search">
      <input id="q" type="search" placeholder="Szukaj: domena, telefon, e-mail, firma, treść reklamy…" aria-label="Szukaj">
    </form>
    <span class="who" title="Zalogowany analityk (demo)">analityk.demo</span>
  </header>
  <nav class="nav" id="nav">
    <a href="#/panel" data-v="panel">Panel</a>
    <a href="#/mapa" data-v="mapa">Mapa powiązań</a>
    <a href="#/kolejka" data-v="kolejka">Do sprawdzenia</a>
    <a href="#/kampanie" data-v="kampanie">Kampanie</a>
    <a href="#/zmiany" data-v="zmiany">Historia zmian</a>
    <a href="#/dodaj" data-v="dodaj">Dodaj / zgłoś</a>
    <a href="#/wagi" data-v="wagi">Wagi ryzyka</a>
  </nav>
  <main id="view" class="view"></main>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <button class="close" id="drawerClose" aria-label="Zamknij">×</button>
    <div id="drawerBody"></div>
  </aside>
  <footer class="foot">InvestTrace wskazuje <b>sygnały ryzyka</b> i powiązania wymagające weryfikacji. Nie stwierdza, że podmiot jest oszustem. Dane demo są fikcyjne.</footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
